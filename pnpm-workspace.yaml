packages:
  - apps/playground
  - sdk/js
  - sdk/expo
  - examples/expo

allowBuilds:
  esbuild: true

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  "@vitejs/plugin-react": ^5.2.0
  vite-plus: 1.0.0
  typescript: ^5.9.3
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.19"
  - "@expo/config-plugins@58.0.12"
  - "@expo/config@58.0.11"
  - "@expo/env@2.5.4"
  - "@expo/fingerprint@0.21.9"
  - "@expo/inline-modules@0.2.9"
  - "@expo/local-build-cache-provider@58.0.11"
  - "@expo/log-box@58.0.15"
  - "@expo/metro-config@58.0.21"
  - "@expo/prebuild-config@58.0.19"
  - "@expo/router-server@58.0.21"
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
