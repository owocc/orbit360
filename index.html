<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>环绕视角 · Orbit Scrub</title>
<style>
  :root {
    --bg: #0a0b0e;
    --fg: #f2f3f5;
    --muted: #8b909a;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  body::before {
    content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, #1b1f27 0%, #0a0b0e 62%, #050608 100%);
  }
  #stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    cursor: grab; touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  #view {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: block;
    width: 100%; height: 100%; min-width: 0; min-height: 0;
  }

  /* ---------- 左下角控制面板 ---------- */
  #panel {
    position: fixed; z-index: 4;
    left: 14px;
    left: max(14px, env(safe-area-inset-left));
    bottom: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 300px;
    max-width: calc(100vw - 28px);
    padding: 12px;
    border-radius: 16px;
    background: rgba(13, 15, 19, .74);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
    display: grid; grid-template-columns: 1fr auto; gap: 10px 12px;
    align-items: center;
    transition: opacity .26s ease, transform .26s ease, visibility .26s;
  }
  body.ui-hidden #panel {
    opacity: 0; pointer-events: none; visibility: hidden;
    transform: translateY(12px) scale(.98);
  }

  .p-brand { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  /* 右下角示例切换：一条可横向滚动的胶囊栏 */
  .ex-bar {
    position: fixed; z-index: 5; right: 14px;
    bottom: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px;
    max-width: calc(100vw - 28px);
    padding: 5px;
    border-radius: 999px;
    background: rgba(13, 15, 19, .74);
    border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    transition: opacity .26s ease, transform .26s ease, visibility .26s;
  }
  .ex-bar::-webkit-scrollbar { display: none; }
  body.ui-hidden .ex-bar {
    opacity: 0; pointer-events: none; visibility: hidden;
    transform: translateY(10px);
  }
  .ex-pill {
    flex: 0 0 auto; border-radius: 999px; border: 1px solid transparent;
    background: transparent; color: var(--muted);
    font-size: 11.5px; padding: 7px 13px; cursor: pointer;
    white-space: nowrap; transition: color .15s, background .15s;
  }
  .ex-pill:hover { background: rgba(255, 255, 255, .08); color: var(--fg); }
  .ex-pill.on {
    color: #06281e; background: var(--accent); font-weight: 600;
  }
  .p-sub {
    font-size: 10.5px; color: var(--muted); margin-top: 3px;
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .p-deg {
    font-size: 24px; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .p-deg small { font-size: 11px; color: var(--muted); margin-left: 2px; }

  #ring { width: 76px; height: 76px; margin: 0 auto; grid-column: 1 / -1; }
  #ring .track { stroke: rgba(255,255,255,.09); }
  #ring .tick { stroke: rgba(255,255,255,.18); }
  #ring .arc { stroke: var(--accent); stroke-linecap: round; }
  #ring .needle { stroke: var(--accent); }
  #ring text { fill: var(--muted); font-size: 9px; letter-spacing: .1em; }

  .p-sens {
    grid-column: 1 / -1; display: flex; align-items: center;
    font-size: 10.5px; color: var(--muted); letter-spacing: .03em;
  }
  .p-sens span { white-space: nowrap; margin-right: 8px; }
  .p-sens input {
    flex: 1; min-width: 0; height: 16px; accent-color: var(--accent);
    background: transparent; cursor: pointer;
  }
  .p-sens b {
    font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums;
    min-width: 30px; text-align: right; margin-left: 8px;
  }

  .p-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .p-toggles {
    grid-column: 1 / -1; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px;
  }
  .p-toggles button { font-size: 10.5px; padding: 6px 4px; border-radius: 8px; background: rgba(255,255,255,.04); }
  button {
    font: inherit; font-size: 11px; color: var(--fg);
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 4px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { color: #06281e; background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .38; cursor: default; }
  button[hidden] { display: none; }

  #hint {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    top: 16px;
    top: max(16px, env(safe-area-inset-top));
    color: var(--muted); font-size: 11.5px; letter-spacing: .02em;
    text-align: center; width: 100%; padding: 0 20px; pointer-events: none;
    transition: opacity .45s;
  }
  #hint.hide { opacity: 0; }
  body.ui-hidden #hint { opacity: 0; }

  /* 横屏/矮屏：收紧面板，藏掉方位环 */
  @media (max-height: 560px) {
    #ring { display: none; }
    #panel { width: 272px; max-width: calc(100vw - 24px); padding: 10px; gap: 8px 10px; }
    .p-deg { font-size: 20px; }
  }
  /* 窄屏：藏掉方位环，示例条与面板合并成底部控制区 */
  @media (max-width: 480px) and (min-height: 561px) {
    #ring { display: none; }
    #panel { padding: 10px; gap: 8px 10px; }
  }
  @media (max-width: 560px) {
    .ex-bar {
      left: 12px; right: 12px;
      bottom: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      justify-content: flex-start;
      max-width: none;
    }
    #panel {
      bottom: 68px;
      bottom: calc(68px + env(safe-area-inset-bottom));
    }
  }

  #loader {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10;
    display: grid; place-items: center;
    background: var(--bg); transition: opacity .5s;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .loadwrap { width: 260px; max-width: 62vw; text-align: center; }
  .loadwrap p { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
  .bar { height: 2px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>

<div id="stage"><canvas id="view"></canvas></div>

<div id="hint">左右拖拽旋转 · 倾斜手机环视</div>

<div id="panel">
  <div>
    <div class="p-brand" id="title">环绕视角</div>
    <div class="p-sub" id="meta">— / —</div>
  </div>
  <div class="p-deg"><span id="deg">0</span><small>°</small></div>

  <svg id="ring" viewBox="0 0 132 132" aria-hidden="true">
    <circle class="track" cx="66" cy="66" r="52" fill="none" stroke-width="1.5"/>
    <g id="ticks"></g>
    <circle class="arc" id="arc" cx="66" cy="66" r="52" fill="none" stroke-width="2.5"
            stroke-dasharray="0 327" transform="rotate(-90 66 66)"/>
    <line class="needle" id="needle" x1="66" y1="66" x2="66" y2="24" stroke-width="2"/>
    <circle cx="66" cy="66" r="3.2" fill="currentColor" style="color:var(--accent)"/>
    <text x="66" y="124" text-anchor="middle">BEARING</text>
  </svg>

  <label class="p-sens">
    <span>陀螺仪</span>
    <input id="gain" type="range" min="0.4" max="3" step="0.1" value="1" aria-label="陀螺仪灵敏度">
    <b id="gainVal">1.0×</b>
  </label>

  <label class="p-sens">
    <span>自动转速</span>
    <input id="autoSpeed" type="range" min="2" max="60" step="1" value="14" aria-label="自动旋转速度">
    <b id="autoSpeedVal">14°/s</b>
  </label>

  <div class="p-btns">
    <button id="fsBtn">全屏</button>
    <button id="gyroBtn">陀螺仪</button>
    <button id="resetBtn">重置</button>
    <button id="calBtn" disabled>校准</button>
    <button id="invBtn">反向</button>
    <button id="mouseBtn">鼠标跟随</button>
    <button id="autoBtn">自动环绕</button>
    <button id="importBtn">导入</button>
  </div>

  <div class="p-toggles">
    <button id="gyroSmoothBtn" class="on">陀螺仪平滑</button>
    <button id="inertiaBtn" class="on">惯性</button>
    <button id="fitBtn">自适应</button>
    <button id="hdBtn" hidden>标准</button>
  </div>
</div>

<div id="examples" class="ex-bar" hidden></div>

<input id="importFile" type="file" accept=".zip,.orb,application/zip,application/octet-stream" hidden>

<div id="loader">
  <div class="loadwrap">
    <p>载入环绕帧</p>
    <div class="bar"><i id="prog"></i></div>
  </div>
</div>

<script src="sdk/js/orb.js"></script>
<script>
'use strict';

const CFG_URL = 'config.json';
const CATALOG_URL = 'catalog.json';

const el = {
  stage: document.getElementById('stage'),
  canvas: document.getElementById('view'),
  deg: document.getElementById('deg'),
  meta: document.getElementById('meta'),
  title: document.getElementById('title'),
  hint: document.getElementById('hint'),
  loader: document.getElementById('loader'),
  prog: document.getElementById('prog'),
  gyroBtn: document.getElementById('gyroBtn'),
  calBtn: document.getElementById('calBtn'),
  resetBtn: document.getElementById('resetBtn'),
  fsBtn: document.getElementById('fsBtn'),
  mouseBtn: document.getElementById('mouseBtn'),
  gyroSmoothBtn: document.getElementById('gyroSmoothBtn'),
  inertiaBtn: document.getElementById('inertiaBtn'),
  fitBtn: document.getElementById('fitBtn'),
  hdBtn: document.getElementById('hdBtn'),
  gain: document.getElementById('gain'),
  gainVal: document.getElementById('gainVal'),
  autoSpeed: document.getElementById('autoSpeed'),
  autoSpeedVal: document.getElementById('autoSpeedVal'),
  invBtn: document.getElementById('invBtn'),
  autoBtn: document.getElementById('autoBtn'),
  examples: document.getElementById('examples'),
  importBtn: document.getElementById('importBtn'),
  importFile: document.getElementById('importFile'),
  arc: document.getElementById('arc'),
  needle: document.getElementById('needle'),
  ticks: document.getElementById('ticks'),
};
const ctx = el.canvas.getContext('2d', { alpha: false });

const mod = (a, n) => ((a % n) + n) % n;
const shortDelta = (from, to) => mod(to - from + 180, 360) - 180;

function readPref(key) {
  try { return localStorage.getItem(key); } catch (_) { return null; }
}
function writePref(key, value) {
  try { localStorage.setItem(key, value); } catch (_) { /* 隐私模式 */ }
}

const S = {
  cfg: null,
  catalog: null,
  entry: null,
  exampleId: null,
  base: '',
  quality: 'std',
  format: 'zip',
  frameW: 1280,
  frameH: 720,
  canvasW: 0,
  canvasH: 0,
  frames: [],
  layers: [],
  frameSet: null,
  count: 0,
  degPerFrame: 360 / 1,
  frameDeg: 1,
  dirSign: 1,

  angle: 0,          // 渲染角度（平滑后）
  target: 0,         // 目标角度
  vel: 0,            // 惯性 deg/ms
  dragging: false,
  lastPointerX: 0,
  lastPointerT: 0,
  hoverX: null,
  mouseFollow: true,
  gyroSmooth: true,
  inertia: true,
  fitMode: 'contain',
  orientT: 0,

  auto: false,
  autoState: 'off',
  autoDir: 1,
  autoSpeed: 14,
  autoWeight: 0,
  invert: false,
  uiVisible: true,
  lastPointerType: '',
  gyro: false,
  gyroSeen: false,
  pendingGyro: false,
  hasAbsolute: false,
  gyroRef: null,
  gyroBase: 0,
  gyroGain: 1,
  idleSince: 0,
  loaded: 0,
  drawnIndex: -1,
  hudDeg: -1,
};

/* ---------- 加载 ---------- */

/* ---------- 资源包（zip）读取 ---------- */

// Safari 13 及更早没有 Blob.arrayBuffer()/text()，用 FileReader 兜底
function blobToBuffer(blob) {
  if (blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('读取失败'));
    fr.readAsArrayBuffer(blob);
  });
}

function blobToText(blob) {
  if (blob.text) return blob.text();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('读取失败'));
    fr.readAsText(blob, 'utf-8');
  });
}

// 只实现 STORED 与 DEFLATE：STORED 直接切片，DEFLATE 交给浏览器原生解压
async function readZipEntries(blob) {
  const buf = new Uint8Array(await blobToBuffer(blob));
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  const stop = Math.max(0, buf.length - 22 - 65535);
  for (let i = buf.length - 22; i >= stop; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 zip 文件');

  const total = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = new Map();

  for (let i = 0; i < total; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('zip 中央目录损坏');
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const commentLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nameLen));
    const lNameLen = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    entries.set(name, { method, data: buf.subarray(dataStart, dataStart + compSize) });
    off += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

async function zipFileBlob(entries, name) {
  const e = entries.get(name);
  if (!e) return null;
  if (e.method === 0) return new Blob([e.data], { type: 'application/octet-stream' });
  if (typeof DecompressionStream === 'function') {
    const stream = new Blob([e.data]).stream()
      .pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).blob();
  }
  throw new Error(`${name} 使用了 deflate 压缩，当前浏览器无法解压`);
}

function loadImageBlob(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* ---------- 示例与画质 ---------- */

const QUALITY_ORDER = ['std', 'hd', 'uhd'];   // 按钮按升档顺序循环
const QUALITY_LABEL = { uhd: '超清', hd: '高清', std: '标准' };

function isMobileViewport() {
  return Math.min(window.innerWidth, screen?.width ?? 9999) <= 1100;
}

function availableQualities(entry) {
  if (!entry || !entry.packs) return [];
  return QUALITY_ORDER.filter(q => entry.packs[q]);
}

function pickEntry(catalog) {
  if (!catalog || !Array.isArray(catalog.items) || !catalog.items.length) return null;
  const want = new URLSearchParams(location.search).get('e');
  return catalog.items.find(i => i.id === want)
    || catalog.items.find(i => i.id === catalog.default)
    || catalog.items[0];
}

function pickQuality(entry) {
  const avail = availableQualities(entry);
  if (!avail.length) return null;
  const params = new URLSearchParams(location.search);
  const urlQ = params.get('q');
  const pref = readPref('orbit360.quality');
  const dflt = entry.defaults?.quality;
  const mobile = isMobileViewport();

  if (urlQ && avail.includes(urlQ)) return urlQ;
  if (pref && avail.includes(pref)) return pref;
  if (dflt && avail.includes(dflt)) {
    // meta 推荐超清时，手机自动降一档（解码约 500MB），仍可手动切回
    if (mobile && dflt === 'uhd') return avail.includes('hd') ? 'hd' : dflt;
    return dflt;
  }
  return mobile ? (avail.includes('std') ? 'std' : avail[0])
    : (avail.includes('uhd') ? 'uhd' : avail[0]);
}

function syncQualityBtn() {
  if (S.format !== 'zip') { el.hdBtn.hidden = true; return; }
  const avail = availableQualities(S.entry);
  el.hdBtn.hidden = avail.length < 2;
  if (avail.length < 2) return;
  el.hdBtn.textContent = QUALITY_LABEL[S.quality] || S.quality;
  el.hdBtn.classList.toggle('on', S.quality !== 'std');
  el.hdBtn.title = '当前 ' + (S.quality || '') + '，点击切换';
}

function buildExampleBar() {
  const items = S.catalog?.items ?? [];
  if (items.length < 2) { el.examples.hidden = true; return; }
  el.examples.textContent = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ex-pill' + (it.id === S.exampleId ? ' on' : '');
    b.textContent = it.title || it.id;
    b.addEventListener('click', () => {
      if (it.id === S.exampleId) { touchActivity(); return; }
      const url = new URL(location.href);
      url.searchParams.set('e', it.id);
      url.searchParams.delete('q');
      location.href = url.toString();
    });
    el.examples.appendChild(b);
  });
  el.examples.hidden = false;
  const cur = el.examples.querySelector('.ex-pill.on');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ---------- 载入资源包 ---------- */

async function applyConfig(cfg, quality) {
  S.cfg = cfg;
  S.quality = quality;
  S.dirSign = cfg.orbit?.direction === 'ccw' ? -1 : 1;
  S.gyroGain = cfg.gyro?.gain ?? 1;
  S.invert = !!cfg.drag?.invert;

  // 自动旋转：用户偏好 > 包内 defaults > 包配置
  const autoPref = readPref('orbit360.auto');
  const dp = cfg.defaults?.auto;
  S.autoState = autoPref || (dp ? (dp.enabled ? (dp.dir === 'ccw' ? 'ccw' : 'cw') : 'off')
    : (cfg.auto?.enabled ? (cfg.auto?.dir === 'ccw' ? 'ccw' : 'cw') : 'off'));
  S.autoDir = S.autoState === 'ccw' ? -1 : 1;
  S.auto = S.autoState !== 'off';

  const speedPref = parseFloat(readPref('orbit360.autoSpeed'));
  S.autoSpeed = Number.isFinite(speedPref) ? speedPref : (cfg.auto?.degPerSec ?? 14);
  el.autoSpeed.value = String(S.autoSpeed);
  el.autoSpeedVal.textContent = Math.round(S.autoSpeed) + '°/s';
  syncAutoBtn();

  S.mouseFollow = cfg.mouseFollow?.enabled ?? true;
  el.mouseBtn.classList.toggle('on', S.mouseFollow);
  S.gyroSmooth = cfg.gyro?.smooth ?? true;
  el.gyroSmoothBtn.classList.toggle('on', S.gyroSmooth);
  S.inertia = cfg.drag?.inertia ?? true;
  el.inertiaBtn.classList.toggle('on', S.inertia);
  S.fitMode = cfg.video?.fit === 'cover' ? 'cover' : 'contain';
  el.fitBtn.classList.toggle('on', S.fitMode === 'cover');
  el.fitBtn.textContent = S.fitMode === 'cover' ? '铺满' : '自适应';
  el.gain.value = String(S.gyroGain);
  el.gainVal.textContent = S.gyroGain.toFixed(1) + '×';

  el.title.textContent = cfg.title || '环绕视角';
  document.title = cfg.title || '环绕视角';
  buildRing();
}

async function loadFromZipBlob(blob, qualityHint) {
  const entries = await readZipEntries(blob);
  S.format = 'zip';
  const metaBlob = await zipFileBlob(entries, 'meta.json');
  if (!metaBlob) throw new Error('包里缺少 meta.json');
  const cfg = JSON.parse(await blobToText(metaBlob));
  const pack = cfg.pack;
  if (!pack || !Array.isArray(pack.files) || !pack.files.length) throw new Error('meta 缺少 pack.files');

  await applyConfig(cfg, qualityHint || cfg.quality || 'std');

  S.count = pack.count || pack.files.length;
  S.degPerFrame = 360 / S.count;
  S.frameDeg = (cfg.orbit?.spanDeg ?? 360) / S.count;
  S.frameW = pack.frameW;
  S.frameH = pack.frameH;

  // 解出所有图片
  const imgs = new Map();
  let done = 0;
  let next = 0;
  const CONCURRENCY = 6;
  const worker = async () => {
    while (next < pack.files.length) {
      const name = pack.files[next++];
      const b = await zipFileBlob(entries, name);
      imgs.set(name, b ? await loadImageBlob(b) : null);
      done++;
      S.loaded = done;
      el.prog.style.width = (40 + (done / pack.files.length) * 58).toFixed(1) + '%';
    }
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));

  if (pack.type === 'atlas') {
    const per = pack.cols * pack.rows;
    S.frames = Array.from({ length: S.count }, (_, i) => {
      const img = imgs.get(pack.files[Math.floor(i / per)]);
      if (!img) return null;
      const k = i % per;
      return {
        img,
        sx: (k % pack.cols) * pack.frameW,
        sy: Math.floor(k / pack.cols) * pack.frameH,
        sw: pack.frameW,
        sh: pack.frameH,
      };
    });
  } else {
    S.frames = Array.from({ length: S.count }, (_, i) => {
      const img = imgs.get(pack.files[i]);
      return img ? { img, sx: 0, sy: 0, sw: pack.frameW, sh: pack.frameH } : null;
    });
  }

  S.canvasW = pack.frameW;
  S.canvasH = pack.frameH;
  S.layers = [{
    rect: { x: 0, y: 0, width: pack.frameW, height: pack.frameH },
    frames: S.frames,
    count: S.count,
  }];
}

async function loadFromOrbBlob(blob, qualityHint) {
  if (typeof OrbBundle === 'undefined') throw new Error('缺少 sdk/js/orb.js，无法解析 .orb');
  const orb = await OrbBundle.fromBlob(blob);
  const meta = orb.meta;
  S.format = 'orb';

  await applyConfig(meta, qualityHint || meta.codec || 'orb');

  S.canvasW = meta.canvas.width;
  S.canvasH = meta.canvas.height;
  S.frameW = S.canvasW;
  S.frameH = S.canvasH;
  S.count = Math.max.apply(null, meta.videos.map(v => v.frames.count));
  S.degPerFrame = 360 / S.count;
  S.frameDeg = (meta.orbit?.spanDeg ?? 360) / S.count;
  S.angle = S.target = mod(Number(meta.initialAngle) || 0, 360);

  // 每视频一层；画布坐标由 meta.videos[].rect 决定
  const layers = [];
  const jobs = [];
  meta.videos.forEach((v, vi) => {
    const frames = new Array(v.frames.count);
    layers.push({ rect: v.rect, frames, count: v.frames.count });
    for (let fi = 0; fi < v.frames.count; fi++) {
      jobs.push({ vi, fi, frames, w: v.frames.width, h: v.frames.height });
    }
  });

  let done = 0;
  let next = 0;
  const CONCURRENCY = 6;
  const worker = async () => {
    while (next < jobs.length) {
      const j = jobs[next++];
      const b = orb.frameBlob(j.vi, j.fi);
      const img = b ? await loadImageBlob(b) : null;
      j.frames[j.fi] = img ? { img, sx: 0, sy: 0, sw: j.w, sh: j.h } : null;
      done++;
      S.loaded = done;
      el.prog.style.width = (40 + (done / jobs.length) * 58).toFixed(1) + '%';
    }
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  S.layers = layers;
  S.frames = [];
}

async function loadFromBlob(blob, qualityHint) {
  let head = null;
  if (blob.size >= 4) {
    head = new Uint8Array(await blobToBuffer(blob.slice(0, 4)));
  }
  const isOrb = head && head[0] === 0x4f && head[1] === 0x52 && head[2] === 0x42 && head[3] === 0x33;
  if (isOrb) await loadFromOrbBlob(blob, qualityHint);
  else await loadFromZipBlob(blob, qualityHint);
}

async function loadFromUrl(url, quality) {
  el.prog.style.width = '10%';
  const res = await fetch(url, { cache: 'default' });
  if (!res.ok) throw new Error(`包下载失败（HTTP ${res.status}）`);
  const blob = await res.blob();
  el.prog.style.width = '38%';
  await loadFromBlob(blob, quality);
}

async function boot() {
  const params = new URLSearchParams(location.search);
  const orbUrl = params.get('orb');
  if (orbUrl) {
    // 直接用 ?orb=<url> 打开 .orb，不依赖 catalog.json
    S.entry = null;
    S.exampleId = null;
    el.examples.hidden = true;
    await loadFromUrl(orbUrl, null);
  } else {
    S.catalog = await fetch(CATALOG_URL, { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null);

    const entry = pickEntry(S.catalog);
    S.entry = entry;
    S.exampleId = entry ? entry.id : null;
    if (entry) buildExampleBar();

    // 默认走 scene.orb；?fmt=zip 或 ?q= 强制回 zip 的按画质包
    const forceZip = params.get('fmt') === 'zip' || params.has('q');
    const quality = pickQuality(entry);
    const useOrb = !forceZip && !!(entry && entry.orb);
    const url = useOrb ? entry.orb : (quality ? entry.packs[quality] : null);
    if (!url) throw new Error('找不到可用的示例包（catalog.json）');

    await loadFromUrl(url, useOrb ? null : quality);
  }
  syncQualityBtn();

  layout();
  let missing = 0;
  S.layers.forEach(layer => {
    layer.frames.forEach(f => { if (!f || !f.img) missing++; });
  });
  if (missing) {
    el.hint.textContent = `${missing} 帧解码失败（${S.quality}）`;
    el.hint.classList.remove('hide');
  }
  el.loader.classList.add('done');
  setTimeout(() => el.loader.remove(), 600);
  setUI(true);
  uiHideTimer = setTimeout(() => {
    if (!S.dragging) setUI(false);
  }, 3200);
  requestAnimationFrame(loop);
}

/* ---------- 画布 ---------- */

let viewW = 0, viewH = 0, dpr = 1;
const dst = { x: 0, y: 0, w: 0, h: 0 };

function resize() {
  // clientWidth 在 canvas 属性尺寸参与布局的瞬间可能还没更新，取容器尺寸更稳
  const w = el.stage.clientWidth || window.innerWidth;
  const h = el.stage.clientHeight || window.innerHeight;
  const ndpr = Math.min(window.devicePixelRatio || 1, 2);
  dpr = ndpr;
  viewW = w;
  viewH = h;
  const bw = Math.round(w * ndpr);
  const bh = Math.round(h * ndpr);
  if (el.canvas.width !== bw) el.canvas.width = bw;
  if (el.canvas.height !== bh) el.canvas.height = bh;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'medium';
  layout();
}

let resizeQueued = false;
function queueResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    resize();
  });
}
addEventListener('resize', queueResize);
addEventListener('orientationchange', queueResize);
new ResizeObserver(queueResize).observe(el.stage);

function fillBackdrop() {
  const g = ctx.createRadialGradient(
    viewW * 0.5, viewH * 0.42, 0,
    viewW * 0.5, viewH * 0.42, Math.max(viewW, viewH) * 0.78,
  );
  g.addColorStop(0, '#1b1f27');
  g.addColorStop(0.62, '#0a0b0e');
  g.addColorStop(1, '#050608');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, viewW, viewH);
}

function layout() {
  const cfg = S.cfg;
  if (!cfg || !viewW || !viewH) return;
  const vw = S.canvasW || S.frameW || cfg.video?.width || 1280;
  const vh = S.canvasH || S.frameH || cfg.video?.height || 720;
  const cover = S.fitMode === 'cover';
  const base = cover
    ? Math.max(viewW / vw, viewH / vh)                     // 铺满：填满视口，裁掉多余
    : Math.min(viewW / vw, viewH / vh) * (viewH > viewW ? (cfg.video?.portraitScale ?? 1.25) : 1);
  const scale = base * (cover ? 1 : (cfg.video?.displayScale || 1));
  dst.w = vw * scale;
  dst.h = vh * scale;
  dst.x = (viewW - dst.w) / 2;
  dst.y = (viewH - dst.h) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fillBackdrop();
  S.drawnIndex = -1;
  // 立即补画当前帧：否则清屏与下一帧 rAF 之间会出现一次空画面（视觉上是闪）
  if (S.cfg && S.count && S.layers.length) paint();
}

function frameIndex() {
  if (!S.count) return 0;
  return mod(Math.round(mod(S.angle * S.dirSign, 360) / S.degPerFrame), S.count);
}

// 多视频时各层帧数可能不同：按全局帧号占整圈的比例取该层的帧
function layerFrame(layer, idx) {
  if (!layer.count) return null;
  const i = layer.count === S.count ? idx
    : mod(Math.floor(idx * layer.count / S.count), layer.count);
  return layer.frames[i];
}

// 只在帧号变化时重绘：单帧硬切，无叠加过渡
// 关键：不清屏，直接覆盖。这样任何一帧都不会出现「已清空、尚未绘制」的空窗，
// 移动端 GPU 上传有延迟时也不会闪。
function paint() {
  if (!S.cfg || !S.layers.length) return;
  const idx = frameIndex();
  if (idx === S.drawnIndex) return;
  S.drawnIndex = idx;

  const cw = S.canvasW || S.frameW || 1;
  const ch = S.canvasH || S.frameH || 1;
  const sx = dst.w / cw;
  const sy = dst.h / ch;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < S.layers.length; i++) {
    const layer = S.layers[i];
    const f = layerFrame(layer, idx);
    if (!f || !f.img) continue;
    const r = layer.rect;
    ctx.drawImage(f.img, f.sx, f.sy, f.sw, f.sh,
      dst.x + r.x * sx, dst.y + r.y * sy, r.width * sx, r.height * sy);
  }
  el.meta.textContent = `帧 ${idx + 1} / ${S.count} · ${S.frameDeg.toFixed(2)}°/帧`;
}

/* ---------- 主循环 ---------- */

// 静止后渐入自动旋转；任何交互都以更快的速度渐出，避免启停顿挫
function updateAuto(dt, t) {
  const want = (S.auto && !S.gyro && !S.dragging
    && (t - S.idleSince) > (S.cfg?.auto?.idleDelayMs ?? 2200)) ? 1 : 0;
  const tau = want
    ? (S.cfg?.auto?.rampInMs ?? 700)
    : (S.dragging ? 120 : (S.cfg?.auto?.rampOutMs ?? 280));

  S.autoWeight += (want - S.autoWeight) * (1 - Math.exp(-dt / tau));
  if (want === 0 && S.autoWeight < 0.004) { S.autoWeight = 0; return; }
  if (S.autoWeight <= 0) return;

  S.target += S.autoDir * S.autoSpeed * S.autoWeight * dt / 1000;
}

let lastT = 0;
function loop(t) {
  const dt = Math.min(t - (lastT || t), 64);
  lastT = t;

  if (!S.dragging) {
    if (S.inertia && !S.gyro && Math.abs(S.vel) > 0.0005) {
      S.target += S.vel * dt;
      S.vel *= Math.exp(-dt / (S.cfg.drag?.inertiaMs ?? 110));
      touchActivity();
    } else {
      S.vel = 0;
    }
  }
  updateAuto(dt, t);

  const d = shortDelta(S.angle, S.target);
  const tau = S.cfg.motion?.smoothMs ?? 62;
  S.angle = mod(S.angle + d * (1 - Math.exp(-dt / tau)), 360);
  if (Math.abs(shortDelta(S.angle, S.target)) < 0.0005) S.angle = mod(S.target, 360);
  S.target = mod(S.target, 360);

  paint();
  updateHUD();
  requestAnimationFrame(loop);
}

function updateHUD() {
  const deg = Math.round(mod(S.angle, 360));
  if (deg === S.hudDeg) return;
  S.hudDeg = deg;
  el.deg.textContent = deg.toString();
  el.needle.setAttribute('transform', `rotate(${mod(S.angle, 360).toFixed(1)} 66 66)`);
  const r = 52, c = 2 * Math.PI * r;
  el.arc.setAttribute('stroke-dasharray', `${(c * deg / 360).toFixed(2)} ${c.toFixed(2)}`);
}

function buildRing() {
  let s = '';
  for (let i = 0; i < 72; i++) {
    const major = i % 6 === 0;
    const a = (i / 72) * Math.PI * 2;
    const r1 = 52, r2 = major ? 45 : 48;
    s += `<line class="tick" x1="${(66 + Math.sin(a) * r1).toFixed(2)}" y1="${(66 - Math.cos(a) * r1).toFixed(2)}"
          x2="${(66 + Math.sin(a) * r2).toFixed(2)}" y2="${(66 - Math.cos(a) * r2).toFixed(2)}"
          stroke-width="${major ? 1.4 : 0.8}"/>`;
  }
  el.ticks.innerHTML = s;
}

/* ---------- 拖拽 & UI ---------- */

const LONG_PRESS_MS = 420;
let pressTimer = null;
let pressStart = null;
let suppressMove = false;
let uiHideTimer = null;

function touchActivity() {
  S.idleSince = performance.now();
}

function setUI(visible) {
  S.uiVisible = visible;
  document.body.classList.toggle('ui-hidden', !visible);
}

function toggleUI() {
  setUI(!S.uiVisible);
}

el.stage.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  S.lastPointerType = e.pointerType;
  if (S.pendingGyro) {          // iOS：首次手势内申请权限并自动开启
    S.pendingGyro = false;
    enableGyro();
  }
  S.dragging = true;
  S.vel = 0;
  S.hoverX = null;
  S.lastPointerX = e.clientX;
  S.lastPointerT = e.timeStamp;
  el.stage.classList.add('dragging');
  try { el.stage.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件无活动指针 */ }
  touchActivity();
  el.hint.classList.add('hide');

  clearTimeout(pressTimer);
  pressTimer = null;
  pressStart = { x: e.clientX, y: e.clientY };
  if (e.pointerType !== 'mouse') {
    pressTimer = setTimeout(() => {
      pressTimer = null;
      suppressMove = true;
      S.dragging = false;
      S.vel = 0;
      el.stage.classList.remove('dragging');
      toggleUI();
      navigator.vibrate?.(8);
    }, LONG_PRESS_MS);
  }
});

el.stage.addEventListener('pointermove', e => {
  if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 8) {
    clearTimeout(pressTimer);
    pressTimer = null;
    pressStart = null;           // 动了就算拖拽，取消长按
  }
  if (suppressMove) return;

  if (!S.dragging) {
    // 鼠标悬停即可转向，无需按住
    if (S.mouseFollow && e.pointerType === 'mouse' && e.buttons === 0) {
      if (S.hoverX === null) { S.hoverX = e.clientX; return; }
      const mx = e.clientX - S.hoverX;
      S.hoverX = e.clientX;
      if (mx) {
        const d = mx * (S.cfg?.mouseFollow?.degPerPx ?? 0.3) * (S.invert ? -1 : 1);
        S.target += d;
        if (S.gyro) S.gyroBase = mod(S.gyroBase + d, 360);
        touchActivity();
      }
    }
    return;
  }
  const dx = e.clientX - S.lastPointerX;
  const dt = Math.max(e.timeStamp - S.lastPointerT, 1);
  const deg = dx * (S.cfg?.drag?.degPerPx ?? 0.42) * (S.invert ? -1 : 1);
  S.target += deg;
  if (S.gyro) S.gyroBase = mod(S.gyroBase + deg, 360);
  const inst = dt > 90 ? 0 : deg / dt;
  S.vel = 0.6 * inst + 0.4 * S.vel;
  S.lastPointerX = e.clientX;
  S.lastPointerT = e.timeStamp;
  touchActivity();
});

function endDrag(e) {
  clearTimeout(pressTimer);
  pressTimer = null;
  pressStart = null;
  S.hoverX = null;
  el.stage.classList.remove('dragging');
  if (e && e.pointerId !== undefined && el.stage.hasPointerCapture?.(e.pointerId)) {
    try { el.stage.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  if (suppressMove) {
    suppressMove = false;
    S.dragging = false;
    S.vel = 0;
    return;
  }
  if (!S.dragging) return;
  S.dragging = false;
  if (performance.now() - S.lastPointerT > 90) S.vel = 0;
  S.vel = Math.max(-0.55, Math.min(0.55, S.vel));
  touchActivity();
}
el.stage.addEventListener('pointerup', endDrag);
el.stage.addEventListener('pointercancel', endDrag);
el.stage.addEventListener('pointerleave', () => { S.hoverX = null; });

// PC：双击显示/隐藏 UI；触屏走长按
el.stage.addEventListener('dblclick', () => {
  if (S.lastPointerType === 'touch') return;
  clearTimeout(uiHideTimer);
  toggleUI();
});

el.stage.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 陀螺仪 ---------- */

const RAD = Math.PI / 180;

function screenAngle() {
  const so = screen.orientation;
  if (so && typeof so.angle === 'number') return mod(so.angle, 360);
  return typeof window.orientation === 'number' ? mod(window.orientation, 360) : 0;
}

// 由设备姿态解出水平方位角（yaw）：与握持倾斜、横竖屏都无关
function headingOf(e) {
  if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading) && e.webkitCompassHeading >= 0) {
    return e.webkitCompassHeading;               // iOS：直接提供绝对朝向
  }
  const a = e.alpha, b = e.beta, g = e.gamma;
  if (typeof a !== 'number') return null;
  if (typeof b !== 'number' || typeof g !== 'number') return mod(360 - a, 360);

  const A = a * RAD, B = b * RAD, G = g * RAD;
  // 设备 z 轴（屏幕法线）在世界坐标中的方向：R = Rz(alpha)·Rx(beta)·Ry(gamma)
  const vx = Math.sin(G) * Math.cos(A) + Math.cos(G) * Math.sin(B) * Math.sin(A);
  const vy = Math.sin(G) * Math.sin(A) - Math.cos(G) * Math.sin(B) * Math.cos(A);
  const horizontal = Math.hypot(vx, vy);

  if (horizontal < 0.25) {
    // 手机接近平放（z 轴几乎竖直）只能退回 alpha；横屏时屏幕转了 90°，方向相反
    const sa = screenAngle();
    return (sa === 90 || sa === 270) ? mod(a, 360) : mod(360 - a, 360);
  }
  return mod(Math.atan2(-vx, -vy) / RAD, 360);
}

function onOrient(e) {
  const h = headingOf(e);
  if (h === null) return;
  S.gyroSeen = true;
  if (S.dragging) return;      // 拖拽期间让手势优先，避免互相拉扯
  if (S.gyroRef === null) {
    S.gyroRef = h;
    S.gyroBase = S.target;
    return;
  }
  const gain = S.gyroGain * (S.cfg?.gyro?.invert ? -1 : 1) * (S.invert ? -1 : 1);
  const d = shortDelta(S.gyroRef, h) * gain;
  const raw = mod(S.gyroBase - d, 360);

  if (S.gyroSmooth) {
    // 低通滤波：传感器噪声被压掉，代价是约 smoothMs 的延迟
    const now = performance.now();
    const dt = Math.min(Math.max(now - S.orientT, 1), 120);
    S.orientT = now;
    const tau = S.cfg?.gyro?.smoothMs ?? 80;
    S.target = mod(S.target + shortDelta(S.target, raw) * (1 - Math.exp(-dt / tau)), 360);
  } else {
    S.target = raw;
  }
  touchActivity();
}

function onAbsolute(e) {
  if (headingOf(e) === null) return;   // 空读数的 absolute 事件不能锁死相对事件
  S.hasAbsolute = true;
  onOrient(e);
}

function onRelative(e) {
  if (S.hasAbsolute) return;   // 已有绝对朝向，相对 alpha 会跳变
  onOrient(e);
}

function isTouchDevice() {
  return matchMedia('(pointer: coarse)').matches
    || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// 移动端默认申请并开启陀螺仪；iOS 需要首次手势，此时先挂起
function initAutoGyro() {
  if (!isTouchDevice()) return;
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    S.pendingGyro = true;
    el.gyroBtn.textContent = '待授权';
  } else {
    enableGyro();
  }
}

async function enableGyro() {
  if (S.gyro) return;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const p = await DeviceOrientationEvent.requestPermission();
      if (p !== 'granted') throw new Error('permission denied');
    }
    if (typeof DeviceOrientationEvent === 'undefined') throw new Error('unsupported');
    addEventListener('deviceorientationabsolute', onAbsolute, true);
    addEventListener('deviceorientation', onRelative, true);
    S.gyro = true;
    S.gyroSeen = false;
    S.hasAbsolute = false;
    S.gyroRef = null;
    el.gyroBtn.classList.add('on');
    el.gyroBtn.textContent = '陀螺仪已开';
    el.calBtn.disabled = false;
    el.hint.textContent = '转动身体环视 · 仍可拖拽微调';
    el.hint.classList.remove('hide');
    setTimeout(() => el.hint.classList.add('hide'), 3200);

    // 没有传感器读数（桌面/无权限）时自动回退
    setTimeout(() => {
      if (S.gyroSeen) return;
      removeEventListener('deviceorientationabsolute', onAbsolute, true);
      removeEventListener('deviceorientation', onRelative, true);
      S.gyro = false;
      S.gyroRef = null;
      el.gyroBtn.classList.remove('on');
      el.gyroBtn.textContent = '重试陀螺仪';
      el.calBtn.disabled = true;
      el.hint.textContent = '未检测到方向传感器，请用拖拽';
      el.hint.classList.remove('hide');
      setTimeout(() => el.hint.classList.add('hide'), 2600);
    }, 2200);
  } catch (err) {
    el.gyroBtn.textContent = '重试陀螺仪';
    el.hint.textContent = '陀螺仪被拒绝或需 HTTPS，桌面请用拖拽';
    el.hint.classList.remove('hide');
  }
}

/* ---------- 全屏 ---------- */

const fsRoot = document.documentElement;
const fsSupported = !!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen);

function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function syncFsBtn() {
  const on = !!fsElement();
  el.fsBtn.classList.toggle('on', on);
  el.fsBtn.textContent = on ? '退出全屏' : '全屏';
}

async function toggleFullscreen() {
  try {
    if (fsElement()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) await exit.call(document);
    } else {
      const req = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
      if (req) await req.call(fsRoot);
    }
  } catch (err) {
    flashHint('全屏被浏览器拒绝');
  }
  syncFsBtn();
  queueResize();
}

function flashHint(text, ms = 2200) {
  el.hint.textContent = text;
  el.hint.classList.remove('hide');
  setTimeout(() => el.hint.classList.add('hide'), ms);
}

document.addEventListener('fullscreenchange', () => { syncFsBtn(); queueResize(); });
document.addEventListener('webkitfullscreenchange', () => { syncFsBtn(); queueResize(); });
el.fsBtn.addEventListener('click', toggleFullscreen);
if (!fsSupported) el.fsBtn.hidden = true;

/* ---------- 重置 ---------- */

el.resetBtn.addEventListener('click', () => {
  S.target = 0;
  S.vel = 0;
  if (S.gyro) {
    S.gyroRef = null;      // 重新取基准，当前朝向即 0°
    S.gyroBase = 0;
  }
  touchActivity();
  flashHint('已重置到 0°', 1400);
});

el.gyroBtn.addEventListener('click', enableGyro);

el.calBtn.addEventListener('click', () => {
  S.gyroRef = null;
});

el.invBtn.addEventListener('click', () => {
  S.invert = !S.invert;
  el.invBtn.classList.toggle('on', S.invert);
});

el.gain.addEventListener('input', () => {
  S.gyroGain = parseFloat(el.gain.value) || 1;
  el.gainVal.textContent = S.gyroGain.toFixed(1) + '×';
});

el.mouseBtn.addEventListener('click', () => {
  S.mouseFollow = !S.mouseFollow;
  el.mouseBtn.classList.toggle('on', S.mouseFollow);
  S.hoverX = null;
  touchActivity();
  flashHint(S.mouseFollow ? '鼠标移动即可转向' : '鼠标跟随已关闭', 1600);
});

el.gyroSmoothBtn.addEventListener('click', () => {
  S.gyroSmooth = !S.gyroSmooth;
  el.gyroSmoothBtn.classList.toggle('on', S.gyroSmooth);
  S.orientT = 0;
  flashHint(S.gyroSmooth ? '陀螺仪平滑已开' : '陀螺仪原始跟随（会有抖动）', 1600);
});

el.inertiaBtn.addEventListener('click', () => {
  S.inertia = !S.inertia;
  el.inertiaBtn.classList.toggle('on', S.inertia);
  if (!S.inertia) S.vel = 0;
  flashHint(S.inertia ? '松手惯性已开' : '松手即停', 1600);
});

el.fitBtn.addEventListener('click', () => {
  S.fitMode = S.fitMode === 'cover' ? 'contain' : 'cover';
  el.fitBtn.classList.toggle('on', S.fitMode === 'cover');
  el.fitBtn.textContent = S.fitMode === 'cover' ? '铺满' : '自适应';
  layout();
  touchActivity();
});

function syncAutoBtn() {
  el.autoBtn.textContent = S.autoState === 'off' ? '自动环绕'
    : (S.autoState === 'cw' ? '顺时针' : '逆时针');
  el.autoBtn.classList.toggle('on', S.autoState !== 'off');
}

el.autoBtn.addEventListener('click', () => {
  S.autoState = S.autoState === 'off' ? 'cw' : (S.autoState === 'cw' ? 'ccw' : 'off');
  S.auto = S.autoState !== 'off';
  S.autoDir = S.autoState === 'ccw' ? -1 : 1;
  writePref('orbit360.auto', S.autoState);
  syncAutoBtn();
  touchActivity();
  flashHint(S.autoState === 'off' ? '自动旋转已关闭'
    : (S.autoState === 'cw' ? '顺时针自动旋转' : '逆时针自动旋转'), 1400);
});

el.autoSpeed.addEventListener('input', () => {
  S.autoSpeed = parseFloat(el.autoSpeed.value) || 14;
  el.autoSpeedVal.textContent = Math.round(S.autoSpeed) + '°/s';
  writePref('orbit360.autoSpeed', String(S.autoSpeed));
  touchActivity();
});

el.importBtn.addEventListener('click', () => el.importFile.click());

el.importFile.addEventListener('change', async () => {
  const file = el.importFile.files && el.importFile.files[0];
  el.importFile.value = '';
  if (!file) return;
  try {
    flashHint('正在解析 ' + file.name, 4000);
    await loadFromBlob(file, null);
    S.entry = null;                 // 导入模式没有示例清单，画质切换隐藏
    S.exampleId = null;
    const pills = el.examples.querySelectorAll('.ex-pill');
    for (let i = 0; i < pills.length; i++) pills[i].classList.remove('on');
    syncQualityBtn();
    layout();
    flashHint(`已载入 ${S.cfg.title || file.name}`, 2400);
  } catch (err) {
    flashHint('导入失败：' + err.message, 4000);
  }
});

el.hdBtn.addEventListener('click', () => {
  const avail = availableQualities(S.entry);
  if (avail.length < 2) return;
  const i = avail.indexOf(S.quality);
  const next = avail[(i + 1) % avail.length];
  if (!next || next === S.quality) return;
  writePref('orbit360.quality', next);
  const url = new URL(location.href);
  url.searchParams.set('q', next);
  location.href = url.toString();
});

/* ---------- 键盘 ---------- */

addEventListener('keydown', e => {
  const step = e.shiftKey ? 15 : 3;
  if (e.key === 'ArrowRight') { S.target += step; touchActivity(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { S.target -= step; touchActivity(); e.preventDefault(); }
  else if (e.key === ' ') { el.autoBtn.click(); e.preventDefault(); }
  else if (e.key === 'h' || e.key === 'H') { clearTimeout(uiHideTimer); toggleUI(); e.preventDefault(); }
});

/* ---------- 启动 ---------- */

resize();
S.idleSince = performance.now();
boot().catch(err => {
  el.prog.style.background = '#f87171';
  el.loader.querySelector('p').textContent = '加载失败：' + err.message + '（需 HTTP 服务，勿用 file://）';
  console.error(err);
});
</script>
</body>
</html>
