name: SDK · npm

# 发布前在仓库 Settings → Secrets and variables → Actions 里添加：
#   NPM_TOKEN = npm 的 Automation / Granular Access Token（勾选 @orbit360 包写权限）
# 然后创建 GitHub Release，或手动运行本工作流并关闭 dry_run。

on:
  pull_request:
    paths:
      - "sdk/**"
      - "spec/**"
      - "fixtures/**"
      - "conformance/**"
      - "scripts/conformance/**"
      - "apps/playground/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/npm-publish.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只校验 / 打包，不执行 npm publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: 校验 SDK 与页面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装依赖
        run: pnpm dlx --package=vite-plus@1.0.0 vp install --frozen-lockfile
      - name: 检查 / 格式化 / 类型
        run: pnpm exec vp run check
      - name: 全平台 TypeScript conformance
        run: pnpm exec vp test
      - name: 构建 SDK 与页面
        run: pnpm exec vp run build
      - name: 校验 web client
        run: >-
          node -e "const m=require('./sdk/js/dist/web-client.js');
          if(typeof m.Orbit360Client!=='function'||m.Orbit360Client.name!=='Orbit360Client')process.exit(1);
          console.log('web client',m.VERSION);"
      - name: 解析示例 .orb
        run: >-
          node -e "const fs=require('fs');const O=require('./sdk/js/dist/index.js');
          const b=fs.readFileSync('assets/maid/scene.orb');
          const o=O.parse(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength));
          if(!o.meta||o.meta.totalFrames!==o.entries.length)process.exit(1);
          console.log(o.meta.title,o.meta.totalFrames,'frames');"
      - name: 检查 javascript 发布内容
        working-directory: sdk/js
        run: pnpm exec vp pm pack -- --dry-run
      - name: 校验微信小程序 SDK
        run: >-
          node -e "const m=require('./sdk/wechat-miniprogram/dist/orbit360-miniprogram.js');
          if(typeof m.createClient!=='function'||typeof m.Orbit360Client!=='function'||typeof m.parseOrb!=='function')process.exit(1);
          console.log('wechat miniprogram',m.VERSION);"
      - name: 检查微信小程序发布内容
        working-directory: sdk/wechat-miniprogram
        run: pnpm exec vp pm pack -- --dry-run
      - name: 校验抖音小程序 SDK
        run: >-
          node -e "const m=require('./sdk/douyin-miniprogram/dist/orbit360-douyin.js');
          if(typeof m.createClient!=='function'||typeof m.Orbit360Client!=='function'||typeof m.parseOrb!=='function')process.exit(1);
          console.log('douyin miniprogram',m.VERSION);"

  conformance-go:
    name: Conformance · Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: sdk/go/go.mod
      - name: Go parser / engine / layout
        working-directory: sdk/go
        run: go test ./...

  conformance-flutter:
    name: Conformance · Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter parser / engine / layout
        working-directory: sdk/flutter
        run: |
          flutter pub get
          flutter test

  publish-javascript:
    name: 发布 @orbit360/javascript
    needs: verify
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装依赖
        run: pnpm dlx --package=vite-plus@1.0.0 vp install --frozen-lockfile
      - name: 构建 SDK
        run: pnpm exec vp run build:sdk
      - name: 发布到 npm
        working-directory: sdk/js
        run: pnpm exec vp pm publish -- --access public --provenance
        env:
          # 占位：填入仓库 Secrets 里的 NPM_TOKEN 后即可发布
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wechat:
    name: 发布 @orbit360/wechat-miniprogram
    needs: verify
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装依赖
        run: pnpm dlx --package=vite-plus@1.0.0 vp install --frozen-lockfile
      - name: 构建 SDK
        run: pnpm exec vp run build:sdk
      - name: 发布到 npm
        working-directory: sdk/wechat-miniprogram
        run: pnpm exec vp pm publish -- --access public --provenance
        env:
          # 占位：填入仓库 Secrets 里的 NPM_TOKEN 后即可发布
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
