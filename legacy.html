<!DOCTYPE html>
<html lang="zh-CN" data-legacy="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>兼容版 · 环绕视角 · Orbit Scrub</title>
<style>
  :root {
    --bg: #0a0b0e;
    --fg: #f2f3f5;
    --muted: #8b909a;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  body::before {
    content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, #1b1f27 0%, #0a0b0e 62%, #050608 100%);
  }
  #stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    cursor: grab; touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  #view {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: block;
    width: 100%; height: 100%; min-width: 0; min-height: 0;
  }

  /* ---------- 左下角控制面板 ---------- */
  #panel {
    position: fixed; z-index: 4;
    left: 14px;
    left: max(14px, env(safe-area-inset-left));
    bottom: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 300px;
    max-width: calc(100vw - 28px);
    padding: 12px;
    border-radius: 16px;
    background: rgba(13, 15, 19, .74);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
    display: grid; grid-template-columns: 1fr auto; gap: 10px 12px;
    align-items: center;
    transition: opacity .26s ease, transform .26s ease, visibility .26s;
  }
  body.ui-hidden #panel {
    opacity: 0; pointer-events: none; visibility: hidden;
    transform: translateY(12px) scale(.98);
  }

  .p-brand { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  /* 右下角示例切换：一条可横向滚动的胶囊栏 */
  .ex-bar {
    position: fixed; z-index: 5; right: 14px;
    bottom: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px;
    max-width: calc(100vw - 28px);
    padding: 5px;
    border-radius: 999px;
    background: rgba(13, 15, 19, .74);
    border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    transition: opacity .26s ease, transform .26s ease, visibility .26s;
  }
  .ex-bar::-webkit-scrollbar { display: none; }
  body.ui-hidden .ex-bar {
    opacity: 0; pointer-events: none; visibility: hidden;
    transform: translateY(10px);
  }
  .ex-pill {
    flex: 0 0 auto; border-radius: 999px; border: 1px solid transparent;
    background: transparent; color: var(--muted);
    font-size: 11.5px; padding: 7px 13px; cursor: pointer;
    white-space: nowrap; transition: color .15s, background .15s;
  }
  .ex-pill:hover { background: rgba(255, 255, 255, .08); color: var(--fg); }
  .ex-pill.on {
    color: #06281e; background: var(--accent); font-weight: 600;
  }
  .p-sub {
    font-size: 10.5px; color: var(--muted); margin-top: 3px;
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .p-deg {
    font-size: 24px; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .p-deg small { font-size: 11px; color: var(--muted); margin-left: 2px; }

  #ring { width: 76px; height: 76px; margin: 0 auto; grid-column: 1 / -1; }
  #ring .track { stroke: rgba(255,255,255,.09); }
  #ring .tick { stroke: rgba(255,255,255,.18); }
  #ring .arc { stroke: var(--accent); stroke-linecap: round; }
  #ring .needle { stroke: var(--accent); }
  #ring text { fill: var(--muted); font-size: 9px; letter-spacing: .1em; }

  .p-sens {
    grid-column: 1 / -1; display: flex; align-items: center;
    font-size: 10.5px; color: var(--muted); letter-spacing: .03em;
  }
  .p-sens span { white-space: nowrap; margin-right: 8px; }
  .p-sens input {
    flex: 1; min-width: 0; height: 16px; accent-color: var(--accent);
    background: transparent; cursor: pointer;
  }
  .p-sens b {
    font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums;
    min-width: 30px; text-align: right; margin-left: 8px;
  }

  .p-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .p-toggles {
    grid-column: 1 / -1; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px;
  }
  .p-toggles button { font-size: 10.5px; padding: 6px 4px; border-radius: 8px; background: rgba(255,255,255,.04); }
  button {
    font: inherit; font-size: 11px; color: var(--fg);
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 4px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { color: #06281e; background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .38; cursor: default; }
  button[hidden] { display: none; }

  #hint {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    top: 16px;
    top: max(16px, env(safe-area-inset-top));
    color: var(--muted); font-size: 11.5px; letter-spacing: .02em;
    text-align: center; width: 100%; padding: 0 20px; pointer-events: none;
    transition: opacity .45s;
  }
  #hint.hide { opacity: 0; }
  body.ui-hidden #hint { opacity: 0; }

  /* 横屏/矮屏：收紧面板，藏掉方位环 */
  @media (max-height: 560px) {
    #ring { display: none; }
    #panel { width: 272px; max-width: calc(100vw - 24px); padding: 10px; gap: 8px 10px; }
    .p-deg { font-size: 20px; }
  }
  /* 窄屏：藏掉方位环，示例条与面板合并成底部控制区 */
  @media (max-width: 480px) and (min-height: 561px) {
    #ring { display: none; }
    #panel { padding: 10px; gap: 8px 10px; }
  }
  @media (max-width: 560px) {
    .ex-bar {
      left: 12px; right: 12px;
      bottom: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      justify-content: flex-start;
      max-width: none;
    }
    #panel {
      bottom: 68px;
      bottom: calc(68px + env(safe-area-inset-bottom));
    }
  }

  #loader {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10;
    display: grid; place-items: center;
    background: var(--bg); transition: opacity .5s;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .loadwrap { width: 260px; max-width: 62vw; text-align: center; }
  .loadwrap p { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
  .bar { height: 2px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>

<div id="stage"><canvas id="view"></canvas></div>

<div id="hint">左右拖拽旋转 · 倾斜手机环视</div>

<div id="panel">
  <div>
    <div class="p-brand" id="title">环绕视角</div>
    <div class="p-sub" id="meta">— / —</div>
  </div>
  <div class="p-deg"><span id="deg">0</span><small>°</small></div>

  <svg id="ring" viewBox="0 0 132 132" aria-hidden="true">
    <circle class="track" cx="66" cy="66" r="52" fill="none" stroke-width="1.5"/>
    <g id="ticks"></g>
    <circle class="arc" id="arc" cx="66" cy="66" r="52" fill="none" stroke-width="2.5"
            stroke-dasharray="0 327" transform="rotate(-90 66 66)"/>
    <line class="needle" id="needle" x1="66" y1="66" x2="66" y2="24" stroke-width="2"/>
    <circle cx="66" cy="66" r="3.2" fill="currentColor" style="color:var(--accent)"/>
    <text x="66" y="124" text-anchor="middle">BEARING</text>
  </svg>

  <label class="p-sens">
    <span>陀螺仪</span>
    <input id="gain" type="range" min="0.4" max="3" step="0.1" value="1" aria-label="陀螺仪灵敏度">
    <b id="gainVal">1.0×</b>
  </label>

  <label class="p-sens">
    <span>自动转速</span>
    <input id="autoSpeed" type="range" min="2" max="60" step="1" value="14" aria-label="自动旋转速度">
    <b id="autoSpeedVal">14°/s</b>
  </label>

  <div class="p-btns">
    <button id="fsBtn">全屏</button>
    <button id="gyroBtn">陀螺仪</button>
    <button id="resetBtn">重置</button>
    <button id="calBtn" disabled>校准</button>
    <button id="invBtn">反向</button>
    <button id="mouseBtn">鼠标跟随</button>
    <button id="autoBtn">自动环绕</button>
    <button id="importBtn">导入</button>
  </div>

  <div class="p-toggles">
    <button id="gyroSmoothBtn" class="on">陀螺仪平滑</button>
    <button id="inertiaBtn" class="on">惯性</button>
    <button id="fitBtn">自适应</button>
    <button id="hdBtn" hidden>标准</button>
  </div>
</div>

<div id="examples" class="ex-bar" hidden></div>

<input id="importFile" type="file" accept=".zip,.orb,application/zip,application/octet-stream" hidden>

<div id="loader">
  <div class="loadwrap">
    <p>载入环绕帧</p>
    <div class="bar"><i id="prog"></i></div>
  </div>
</div>

<script>
/* orb.js — ORB3 场景包解析（浏览器 / Node，无依赖）
 *
 *   var orb = await OrbBundle.fromBlob(file);   // File / Blob
 *   orb.meta                                    // JSON meta
 *   orb.frameBlob(videoIndex, frameIndex)       // 该帧的 Blob（按 offset/length 切片）
 *   orb.frameEntry(videoIndex, frameIndex)      // { video, length, offset }
 *
 * 也支持整文件 ArrayBuffer：
 *   var orb = OrbBundle.parse(arrayBuffer);
 *
 * 头部 32B：magic "ORB3" / version / prefixLen / metaLen / indexLen /
 *           frameCount / indexEntrySize / flags（全部小端）
 * Index 每帧 16B：<IIQ> videoIndex, length, absoluteOffset
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.OrbBundle = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var MAGIC = [0x4f, 0x52, 0x42, 0x33];   // "ORB3"
  var HEADER_SIZE = 32;
  var ENTRY_SIZE = 16;
  var FORMAT = 'orbit360.bundle';
  var VERSION = 1;

  function fail(msg) { throw new Error('ORB3: ' + msg); }

  function isInt(n) {
    return typeof n === 'number' && isFinite(n) && Math.floor(n) === n;
  }

  function readBlob(blob) {
    if (blob.arrayBuffer) return blob.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error || new Error('读取失败')); };
      fr.readAsArrayBuffer(blob);
    });
  }

  function decodeUtf8(bytes) {
    if (typeof TextDecoder === 'function') return new TextDecoder('utf-8').decode(bytes);
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return decodeURIComponent(escape(s));
  }

  function parseHeader(buffer) {
    if (buffer.byteLength < HEADER_SIZE) fail('头部不足 32 字节');
    var dv = new DataView(buffer);
    for (var i = 0; i < 4; i++) {
      if (dv.getUint8(i) !== MAGIC[i]) fail('magic 不是 ORB3');
    }
    var h = {
      version: dv.getUint32(4, true),
      prefixLen: dv.getUint32(8, true),
      metaLen: dv.getUint32(12, true),
      indexLen: dv.getUint32(16, true),
      frameCount: dv.getUint32(20, true),
      indexEntrySize: dv.getUint32(24, true),
      flags: dv.getUint32(28, true),
    };
    if (h.version !== VERSION) fail('不支持的版本 ' + h.version);
    if (h.indexEntrySize !== ENTRY_SIZE) fail('不支持的索引项大小 ' + h.indexEntrySize);
    if (h.indexLen !== h.frameCount * ENTRY_SIZE) fail('indexLen 与 frameCount 不一致');
    if (h.prefixLen !== HEADER_SIZE + h.metaLen + h.indexLen) fail('prefixLen 不一致');
    if (h.frameCount <= 0) fail('frameCount 为 0');
    return h;
  }

  function parsePrefix(buffer, h, fileSize, strictEnd) {
    if (buffer.byteLength < h.prefixLen) fail('Header/Meta/Index 不完整');
    var dv = new DataView(buffer, 0, h.prefixLen);

    var meta;
    try {
      meta = JSON.parse(decodeUtf8(new Uint8Array(buffer, HEADER_SIZE, h.metaLen)));
    } catch (err) {
      fail('meta 不是合法 JSON: ' + err.message);
    }
    if (!meta || meta.format !== FORMAT) fail('meta.format 不是 ' + FORMAT);
    var canvas = meta.canvas || {};
    if (!isInt(canvas.width) || !isInt(canvas.height) || canvas.width <= 0 || canvas.height <= 0) {
      fail('meta 缺少合法的 canvas.width/height');
    }
    if (meta.totalFrames !== h.frameCount) fail('meta.totalFrames 与头部不一致');
    if (typeof meta.codec !== 'string' || !meta.codec) fail('meta 缺少 codec');
    if (!Array.isArray(meta.videos) || !meta.videos.length) fail('meta 缺少 videos 数组');

    var sum = 0;
    var expectStart = 0;
    var vi;
    for (vi = 0; vi < meta.videos.length; vi++) {
      var v = meta.videos[vi];
      var f = v && v.frames;
      var r = v && v.rect;
      if (!v || !f || !r) fail('视频 ' + vi + ' 缺少 rect/frames');
      if (!isInt(f.count) || f.count <= 0) fail('视频 ' + vi + ' 的 frames.count 非法');
      if (f.indexStart !== expectStart) fail('视频 ' + vi + ' 的 indexStart 不连续');
      if (!isInt(r.x) || !isInt(r.y) || !isInt(r.width) || !isInt(r.height)) {
        fail('视频 ' + vi + ' 的 rect 不是整数');
      }
      if (r.x < 0 || r.y < 0 || r.width <= 0 || r.height <= 0 ||
          r.x + r.width > canvas.width || r.y + r.height > canvas.height) {
        fail('视频 ' + vi + ' 的 rect 越界');
      }
      expectStart += f.count;
      sum += f.count;
    }
    if (sum !== h.frameCount) fail('videos 帧数之和与 frameCount 不一致');

    var entries = new Array(h.frameCount);
    var expectedOff = h.prefixLen;
    var e = 0;
    for (vi = 0; vi < meta.videos.length; vi++) {
      var count = meta.videos[vi].frames.count;
      for (var k = 0; k < count; k++) {
        var base = HEADER_SIZE + h.metaLen + e * ENTRY_SIZE;
        var ev = dv.getUint32(base, true);
        var len = dv.getUint32(base + 4, true);
        var lo = dv.getUint32(base + 8, true);
        var hi = dv.getUint32(base + 12, true);
        var off = hi * 4294967296 + lo;
        if (ev !== vi) fail('第 ' + e + ' 条索引的 video 编号不对');
        if (!len || off !== expectedOff) fail('第 ' + e + ' 条索引偏移不连续');
        if (fileSize != null && off + len > fileSize) fail('第 ' + e + ' 条索引越界');
        entries[e] = [ev, len, off];
        expectedOff += len;
        e++;
      }
    }
    if (fileSize != null && strictEnd && expectedOff !== fileSize) {
      fail('索引与文件长度不一致（可能被截断）');
    }
    return { meta: meta, entries: entries };
  }

  function makeResult(h, meta, entries, size, blob) {
    function frameEntry(vi, fi) {
      var v = meta.videos[vi];
      if (!v) fail('没有视频 ' + vi);
      if (!isInt(fi) || fi < 0 || fi >= v.frames.count) fail('视频 ' + vi + ' 没有第 ' + fi + ' 帧');
      var e = entries[v.frames.indexStart + fi];
      return { video: e[0], length: e[1], offset: e[2] };
    }
    function frameBlob(vi, fi) {
      if (!blob) fail('parse() 的结果没有 Blob，请用 fromBlob()');
      var e = frameEntry(vi, fi);
      return blob.slice(e.offset, e.offset + e.length);
    }
    return {
      header: h,
      meta: meta,
      entries: entries,
      prefixLen: h.prefixLen,
      size: size,
      blob: blob,
      frameEntry: frameEntry,
      frameBlob: frameBlob,
    };
  }

  function parse(buffer) {
    if (!buffer || typeof buffer.byteLength !== 'number') fail('需要 ArrayBuffer');
    var h = parseHeader(buffer);
    if (buffer.byteLength < h.prefixLen) fail('Header/Meta/Index 不完整');
    var whole = buffer.byteLength > h.prefixLen;
    var parts = parsePrefix(buffer, h, whole ? buffer.byteLength : null, whole);
    return makeResult(h, parts.meta, parts.entries, buffer.byteLength, null);
  }

  function fromBlob(blob) {
    if (!blob || typeof blob.slice !== 'function') fail('需要 Blob / File');
    return readBlob(blob.slice(0, HEADER_SIZE)).then(function (headBuf) {
      var h = parseHeader(headBuf);
      if (h.prefixLen > blob.size) fail('文件被截断（prefixLen 超出文件）');
      return readBlob(blob.slice(0, h.prefixLen)).then(function (prefixBuf) {
        var parts = parsePrefix(prefixBuf, h, blob.size, true);
        return makeResult(h, parts.meta, parts.entries, blob.size, blob);
      });
    });
  }

  return {
    parse: parse,
    fromBlob: fromBlob,
    HEADER_SIZE: HEADER_SIZE,
    ENTRY_SIZE: ENTRY_SIZE,
    VERSION: VERSION,
  };
}));

</script>
<script>
/* legacy.html 专用：给不支持 Pointer Events 的浏览器（iOS 12 及更早）补一层
 * pointerdown / pointermove / pointerup / pointercancel / pointerleave 合成事件。
 * 纯 ES5，必须能在老引擎上直接跑。现代浏览器会跳过整个模块。 */
(function () {
  // 老内核没有 ResizeObserver；resize/orientationchange 已单独绑定，空缺即可
  if (!window.ResizeObserver) {
    window.ResizeObserver = function () {
      this.observe = function () {};
      this.unobserve = function () {};
      this.disconnect = function () {};
    };
  }

  if (window.PointerEvent) return;

  var stage = null;
  function stageEl() {
    if (!stage) stage = document.getElementById('stage');
    return stage;
  }

  function define(ev, key, value) {
    try {
      Object.defineProperty(ev, key, { value: value, configurable: true });
    } catch (e) {
      ev[key] = value;
    }
  }

  function fire(type, src, pointerType, buttons) {
    var target = stageEl();
    if (!target) return;
    var ev = document.createEvent('Event');
    ev.initEvent(type, true, true);
    define(ev, 'pointerType', pointerType);
    define(ev, 'pointerId', src.identifier || 1);
    define(ev, 'clientX', src.clientX);
    define(ev, 'clientY', src.clientY);
    define(ev, 'pageX', src.pageX != null ? src.pageX : src.clientX);
    define(ev, 'pageY', src.pageY != null ? src.pageY : src.clientY);
    define(ev, 'button', 0);
    define(ev, 'buttons', buttons);
    define(ev, 'isPrimary', true);
    ev.preventDefault = function () {};
    target.dispatchEvent(ev);
  }

  // 老内核没有 pointer capture API，补空实现避免调用报错
  if (!window.Element.prototype.setPointerCapture) {
    window.Element.prototype.setPointerCapture = function () {};
    window.Element.prototype.releasePointerCapture = function () {};
    window.Element.prototype.hasPointerCapture = function () { return false; };
  }

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    if (e.cancelable) e.preventDefault();
    fire('pointerdown', e.touches[0], 'touch', 1);
  }, { passive: false, capture: false });

  document.addEventListener('touchmove', function (e) {
    if (!e.touches.length) return;
    if (e.cancelable) e.preventDefault();
    fire('pointermove', e.touches[0], 'touch', 1);
  }, { passive: false, capture: false });

  function touchEnd(e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    fire('pointerup', t, 'touch', 0);
  }
  document.addEventListener('touchend', touchEnd, false);
  document.addEventListener('touchcancel', touchEnd, false);

  var down = false;
  function inPanel(el) {
    while (el) {
      if (el.id === 'panel') return true;
      el = el.parentNode;
    }
    return false;
  }

  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    down = true;
    fire('pointerdown', e, 'mouse', 1);
  }, false);

  document.addEventListener('mousemove', function (e) {
    if (!down && inPanel(e.target)) {
      fire('pointerleave', e, 'mouse', 0);
      return;
    }
    fire('pointermove', e, 'mouse', down ? 1 : 0);
  }, false);

  document.addEventListener('mouseup', function (e) {
    if (!down) return;
    down = false;
    fire('pointerup', e, 'mouse', 0);
