name: orbit360_app
description: "Flutter Orbit360 player app matching web capabilities."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  http: ^1.2.0
  sensors_plus: ^7.1.1
  orbit360_render:
    path: ../../sdk/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/maid/scene.orb
    - assets/orbit/scene.orb
